services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dhanasri_dev_pg
      POSTGRES_DB: dhanasri_saree
    ports:
      - "5432:5432"
    volumes:
      - dhanasri_pg_data:/var/lib/postgresql/data

volumes:
  dhanasri_pg_data:
